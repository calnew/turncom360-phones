<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F6F2EA" rx="6"/>
  <!-- building silhouettes -->
  <rect x="50" y="120" width="80" height="160" fill="#4A5E52"/>
  <rect x="140" y="80" width="90" height="200" fill="#2B3A32"/>
  <rect x="240" y="100" width="70" height="180" fill="#4A5E52" opacity="0.85"/>
  <rect x="320" y="140" width="40" height="140" fill="#7A9082"/>
  <!-- windows -->
  <g fill="#F6F2EA" opacity="0.7">
    <rect x="60" y="140" width="12" height="15"/>
    <rect x="80" y="140" width="12" height="15"/>
    <rect x="100" y="140" width="12" height="15"/>
    <rect x="60" y="170" width="12" height="15"/>
    <rect x="80" y="170" width="12" height="15"/>
    <rect x="100" y="170" width="12" height="15"/>
    <rect x="150" y="100" width="14" height="18"/>
    <rect x="175" y="100" width="14" height="18"/>
    <rect x="200" y="100" width="14" height="18"/>
    <rect x="150" y="135" width="14" height="18"/>
    <rect x="175" y="135" width="14" height="18"/>
    <rect x="200" y="135" width="14" height="18"/>
  </g>
  <!-- person walking to work -->
  <circle cx="60" cy="255" r="8" fill="#B85C3B"/>
  <path d="M52,270 L52,285 L68,285 L68,270 Z" fill="#B85C3B"/>
  <!-- briefcase -->
  <rect x="70" y="272" width="10" height="8" fill="#C89D4A" rx="1"/>
  <!-- sun -->
  <circle cx="350" cy="50" r="20" fill="#C89D4A" opacity="0.7"/>
</svg>
