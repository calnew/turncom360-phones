<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F6F2EA" rx="6"/>
  <!-- two figures side by side, hand on shoulder -->
  <!-- Figure 1 -->
  <circle cx="140" cy="120" r="26" fill="#7A9082"/>
  <path d="M100,200 Q100,160 140,160 Q180,160 180,200 L180,280 L100,280 Z" fill="#4A5E52"/>
  <!-- Figure 2 -->
  <circle cx="260" cy="120" r="26" fill="#B85C3B"/>
  <path d="M220,200 Q220,160 260,160 Q300,160 300,200 L300,280 L220,280 Z" fill="#8E3F22"/>
  <!-- arm reaching across -->
  <path d="M180,175 Q200,165 220,180" stroke="#7A9082" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- heart between them -->
  <path d="M190,90 C185,80, 170,80, 170,95 C170,105, 190,120, 200,130 C210,120, 230,105, 230,95 C230,80, 215,80, 210,90 C205,85, 195,85, 190,90 Z" fill="#C89D4A" opacity="0.7"/>
</svg>
